[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gboard"
version = "0.1.0"
description = "A real Grok agent: tool calling, live search over X and the web, and memory. Zero dependencies."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["grok", "xai", "ai-agents", "llm", "tool-calling", "live-search", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gboard = "gboard.cli:main"

[project.urls]
Source = "https://github.com/Roxx0x/gboard"

[tool.hatch.build.targets.wheel]
packages = ["gboard"]
